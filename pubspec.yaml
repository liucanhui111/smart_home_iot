name: smart_home_iot
description: 本地自建智能家居 IoT App - MQTT 通信，无云依赖
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.2.0
  provider: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.8.0
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # 如需自定义字体或图标，在此添加
